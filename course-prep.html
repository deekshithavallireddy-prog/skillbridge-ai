<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Preparation - SkillBridge AI</title>
    <script src="js/courses.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .logo { padding: 20px; font-size: 1.5rem; font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border-color); text-align: center; }
        .nav-group { margin: 10px 0; }
        .nav-label { padding: 10px 20px; font-size: 0.8rem; font-weight: bold; color: var(--text-muted); letter-spacing: 1px; }
        .nav-link { display: flex; align-items: center; padding: 12px 20px; color: var(--text-main); text-decoration: none; transition: background-color 0.2s; }
        .nav-link:hover { background-color: var(--bg-color); color: var(--accent); }
        .nav-link span { margin-right: 10px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        
        .hero-card { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; display: flex; gap: 20px; align-items: center; }
        .hero-icon { font-size: 4rem; }
        .hero-info h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .hero-info p { color: var(--text-muted); margin-bottom: 16px; }
        
        .progress-bar { width: 100%; height: 10px; background: var(--border-color); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; background: none; border: none; font-size: 1rem; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: #eff6ff; color: var(--accent); font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .phase-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .phase-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .phase-color { width: 12px; height: 12px; border-radius: 50%; }
        
        .topic-list { list-style: none; padding-left: 20px; }
        .topic-item { margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .topic-checkbox { width: 16px; height: 16px; cursor: pointer; }
        
        .resource-item { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; background: #fff; }
        .resource-item a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .resource-item a:hover { text-decoration: underline; }
        
        .mcq-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .mcq-q { font-weight: 600; margin-bottom: 12px; }
        .mcq-opt { display: block; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
        .mcq-opt:hover { background: #f8fafc; }
        .mcq-opt.correct { background: #dcfce7; border-color: #22c55e; }
        .mcq-opt.wrong { background: #fee2e2; border-color: #ef4444; }
        .mcq-exp { margin-top: 10px; font-size: 0.9rem; color: var(--text-muted); display: none; }
    </style>
    <script src="js/courses.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">SkillBridge AI</div>
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="my-progress.html" class="nav-link"><span>📈</span> My Progress</a>
        <a href="profile.html" class="nav-link"><span>👤</span> Profile</a>
        <a href="roadmap.html" class="nav-link"><span>🗺️</span> Roadmap</a>
        
        <div class="nav-group">
            <div class="nav-label">--- LEARNING ---</div>
            <a href="gate.html" class="nav-link"><span>🎓</span> GATE Prep</a>
            <a href="course-prep.html" class="nav-link active" style="background:#eff6ff;color:var(--accent);border-right:3px solid var(--accent)"><span>📘</span> Course Prep</a>
            <a href="ai-questions.html" class="nav-link"><span>🤖</span> AI Questions</a>
            <a href="interview.html" class="nav-link"><span>🎤</span> Interview Prep</a>
            <a href="quiz.html" class="nav-link"><span>🧠</span> Skill Quiz</a>
        </div>
        
        <div class="nav-group">
            <div class="nav-label">--- TOOLS ---</div>
            <a href="resume.html" class="nav-link"><span>📄</span> Resume</a>
            <a href="projects.html" class="nav-link"><span>💻</span> Projects</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Content will be injected here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const courseId = localStorage.getItem('sb_selected_course');
            const course = window.getCourse ? window.getCourse(courseId) : null;
            
            const mainContent = document.getElementById('main-content');
            
            if (!course) {
                mainContent.innerHTML = `
                    <div class="hero-card">
                        <div class="hero-info">
                            <h1>Course Not Found</h1>
                            <p>Please select a course from your profile to view study materials.</p>
                            <button onclick="window.location.href='profile.html'" style="padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;">Go to Profile</button>
                        </div>
                    </div>
                `;
                return;
            }

            let progressData = JSON.parse(localStorage.getItem('sb_course_progress_' + courseId) || '{}');
            let totalTopics = 0;
            let completedTopics = 0;
            
            course.phases.forEach(p => {
                p.topics.forEach(t => {
                    totalTopics++;
                    if(progressData[t]) completedTopics++;
                });
            });
            
            const progressPercent = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;

            mainContent.innerHTML = `
                <div class="hero-card">
                    <div class="hero-icon">${course.icon}</div>
                    <div class="hero-info" style="flex:1;">
                        <h1>${course.name}</h1>
                        <p>${course.category} • ${course.duration}</p>
                        <p>${course.description}</p>
                        
                        <div>
                            <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.9rem;font-weight:600;">
                                <span>Progress</span>
                                <span id="progress-text">${completedTopics} / ${totalTopics} Topics (${progressPercent}%)</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('roadmap')">📋 Roadmap</button>
                    <button class="tab-btn" onclick="switchTab('study')">📚 Study Topics</button>
                    <button class="tab-btn" onclick="switchTab('resources')">🎥 Resources</button>
                    <button class="tab-btn" onclick="switchTab('practice')">📝 Practice Questions</button>
                </div>

                <!-- ROADMAP TAB -->
                <div id="tab-roadmap" class="tab-content active">
                    ${course.phases.map((phase, pIdx) => `
                        <div class="phase-card">
                            <div class="phase-title">
                                <div class="phase-color" style="background:${phase.color}"></div>
                                ${phase.name} <span style="font-size:0.9rem;color:var(--text-muted);font-weight:normal;margin-left:auto;">${phase.duration}</span>
                            </div>
                            <ul class="topic-list">
                                ${phase.topics.map(topic => `
                                    <li class="topic-item">
                                        <input type="checkbox" class="topic-checkbox" id="cb-${courseId}-${topic}" ${progressData[topic] ? 'checked' : ''} onchange="toggleTopic('${courseId}', '${topic}')">
                                        <label for="cb-${courseId}-${topic}">${topic}</label>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </div>

                <!-- STUDY TOPICS TAB -->
                <div id="tab-study" class="tab-content">
                    ${course.phases.map(phase => `
                        <div class="phase-card">
                            <h3 style="margin-bottom:12px;color:${phase.color}">${phase.name}</h3>
                            ${phase.topics.map(topic => `
                                <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f1f5f9;">
                                    <strong style="font-size:1.05rem;">${topic}</strong>
                                    <p style="color:var(--text-muted);font-size:0.95rem;margin-top:4px;">Key concept: Learn the fundamental principles and practical applications of ${topic}. Used extensively in industry.</p>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>

                <!-- RESOURCES TAB -->
                <div id="tab-resources" class="tab-content">
                    <div class="phase-card">
                        <h3 style="margin-bottom:16px;">📹 Video Courses & Channels</h3>
                        ${course.resources.filter(r => r.type === 'youtube').map(r => `
                            <div class="resource-item">
                                <span>🎥</span> <a href="${r.url}" target="_blank">${r.label}</a>
                            </div>
                        `).join('')}
                        
                        <h3 style="margin-top:24px;margin-bottom:16px;">🌐 Websites & Docs</h3>
                        ${course.resources.filter(r => r.type === 'website').map(r => `
                            <div class="resource-item">
                                <span>🌐</span> <a href="${r.url}" target="_blank">${r.label}</a>
                            </div>
                        `).join('')}

                        <h3 style="margin-top:24px;margin-bottom:16px;">📚 Recommended Books</h3>
                        ${course.books.map(b => `
                            <div class="resource-item">
                                <span>📚</span> <span>${b}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- PRACTICE QUESTIONS TAB -->
                <div id="tab-practice" class="tab-content">
                    <div style="margin-bottom:16px;font-weight:600;font-size:1.1rem;color:var(--accent);">
                        Current Score: <span id="mcq-score">0</span> / ${course.questions.length}
                    </div>
                    ${course.questions.map((q, qIdx) => `
                        <div class="mcq-card">
                            <div class="mcq-q">${qIdx + 1}. ${q.q}</div>
                            <div>
                                ${q.opts.map((opt, oIdx) => `
                                    <div class="mcq-opt" id="opt-${qIdx}-${oIdx}" onclick="selectMcq(${qIdx}, ${oIdx}, ${q.ans})">
                                        ${String.fromCharCode(65 + oIdx)}. ${opt}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mcq-exp" id="exp-${qIdx}"><strong>Explanation:</strong> ${q.exp}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        window.toggleTopic = function(courseId, topic) {
            let progressData = JSON.parse(localStorage.getItem('sb_course_progress_' + courseId) || '{}');
            const cb = document.getElementById(`cb-${courseId}-${topic}`);
            
            if (cb.checked) {
                progressData[topic] = true;
                // Try to post to API
                const token = localStorage.getItem('sb_token');
                if (token) {
                    fetch('/api/gate/progress', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token},
                        body: JSON.stringify({ subject: courseId, topic: topic })
                    }).catch(()=>{});
                }
            } else {
                delete progressData[topic];
            }
            
            localStorage.setItem('sb_course_progress_' + courseId, JSON.stringify(progressData));
            
            // Recompute stats
            const course = window.getCourse(courseId);
            let total = 0; let completed = 0;
            course.phases.forEach(p => p.topics.forEach(t => { total++; if(progressData[t]) completed++; }));
            const pct = total > 0 ? Math.round((completed/total)*100) : 0;
            
            document.getElementById('progress-text').innerText = `${completed} / ${total} Topics (${pct}%)`;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        let answeredQuestions = {};
        window.selectMcq = function(qIdx, oIdx, ansIdx) {
            if (answeredQuestions[qIdx]) return; // already answered
            answeredQuestions[qIdx] = true;
            
            const selectedOpt = document.getElementById(`opt-${qIdx}-${oIdx}`);
            const correctOpt = document.getElementById(`opt-${qIdx}-${ansIdx}`);
            const exp = document.getElementById(`exp-${qIdx}`);
            
            if (oIdx === ansIdx) {
                selectedOpt.classList.add('correct');
                // Increment score
                const scoreSpan = document.getElementById('mcq-score');
                scoreSpan.innerText = parseInt(scoreSpan.innerText) + 1;
            } else {
                selectedOpt.classList.add('wrong');
                correctOpt.classList.add('correct');
            }
            
            exp.style.display = 'block';
            
            // Save score
            localStorage.setItem('sb_course_mcq_scores', document.getElementById('mcq-score').innerText);
        }
    </script>
</body>
</html>
