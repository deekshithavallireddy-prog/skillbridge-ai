<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ideas & Building Guide - SkillBridge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --primary-color: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            
            /* Difficulty Colors */
            --beginner-bg: #dcfce7;
            --beginner-text: #166534;
            --intermediate-bg: #fef9c3;
            --intermediate-text: #854d0e;
            --advanced-bg: #fee2e2;
            --advanced-text: #991b1b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .logo-section {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .user-section {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary-color);
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .nav-links {
            padding: 16px 0;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            gap: 12px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-right: 3px solid var(--primary-color);
        }

        .logout-btn {
            margin: 24px;
            padding: 10px;
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #fca5a5;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 32px;
            flex-grow: 1;
            max-width: 1200px;
        }

        .top-bar {
            margin-bottom: 32px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 24px;
        }

        .search-filter-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box {
            flex-grow: 1;
            min-width: 250px;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background-color: #f1f5f9;
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .project-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .project-emoji {
            font-size: 24px;
            margin-right: 12px;
        }

        .project-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .difficulty-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .diff-beginner { background-color: var(--beginner-bg); color: var(--beginner-text); }
        .diff-intermediate { background-color: var(--intermediate-bg); color: var(--intermediate-text); }
        .diff-advanced { background-color: var(--advanced-bg); color: var(--advanced-text); }

        .bookmark-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #cbd5e1;
            transition: color 0.2s;
        }

        .bookmark-btn.bookmarked {
            color: #fbbf24;
        }

        .project-body {
            padding: 20px;
            flex-grow: 1;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
            min-height: 42px;
        }

        .tech-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tech-chip {
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .project-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .view-steps-btn {
            width: 100%;
            padding: 10px;
            background-color: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .view-steps-btn:hover {
            background-color: #dbeafe;
        }

        /* Steps Section */
        .steps-container {
            display: none;
            padding: 20px;
            background-color: #f8fafc;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
        }

        .step-item {
            margin-bottom: 16px;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-title {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .step-number {
            background-color: var(--primary-color);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .step-desc {
            color: var(--text-muted);
            padding-left: 28px;
            line-height: 1.5;
        }

        /* No Results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

    </style>
</head>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            ⚡ SkillBridge AI
        </div>
        <div class="user-section">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-name" id="userName">User</div>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">📊 Dashboard</a>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <h1 class="title">Project Ideas & Building Guide</h1>
            <p class="subtitle">Learn by building real projects — step-by-step</p>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value">20</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" style="color: var(--beginner-text)">7</div>
                    <div class="stat-label">Beginner</div>

                <div class="stat-card">
                    <div class="stat-value" style="color: var(--intermediate-text)">8</div>

                <div class="stat-card">

            <div class="search-filter-row">
                <input type="text" id="searchInput" class="search-box" placeholder="Search projects by title, tech, or description...">
            </div>
            
            <div class="filter-tabs" id="difficultyFilters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="beginner">Beginner</button>
                <button class="filter-btn" data-filter="intermediate">Intermediate</button>
                <button class="filter-btn" data-filter="advanced">Advanced</button>
            </div>
            <div class="filter-tabs" id="techFilters" style="margin-top: 12px; margin-bottom: 24px;">

                <button class="filter-btn" data-tech="html">HTML/CSS/JS</button>
                <button class="filter-btn" data-tech="ml">Machine Learning</button>
                <button class="filter-btn" data-tech="react">React</button>
                <button class="filter-btn" data-tech="node">Node.js</button>
            </div>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <!-- Project Cards inserted here by JS -->
        </div>
    </div>

    <script>
        // Setup User Info
        document.addEventListener('DOMContentLoaded', () => {
            const name = localStorage.getItem('sb_name') || 'Student';
            document.getElementById('userName').textContent = name;
            document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            renderProjects();
        });

        function logout() {
            localStorage.removeItem('sb_token');
            localStorage.removeItem('sb_name');
            window.location.href = 'login.html';
        }

        // Projects Data
        const PROJECTS = [
            // BEGINNER
            {
                id: 1,
                title: 'Calculator App',
                emoji: '🧮',
                difficulty: 'beginner',
                desc: 'Build a GUI calculator with basic arithmetic operations',
                tech: ['Python', 'Tkinter'],

                    { title: 'Core Logic / Main Feature', desc: 'Create functions `add(a,b)`, `subtract(a,b)`, `multiply(a,b)`, `divide(a,b)`. Handle division by zero.' },
                    { title: 'UI / Interface', desc: 'Use `tk.Button` grid for digits 0-9 and operators. Use `tk.Entry` for display. Place buttons using `.grid(row, column)`' },
                    { title: 'Testing', desc: 'Test all operations. Test edge cases: 0÷0, very large numbers, decimal points' },
                    { title: 'Add Extra Features', desc: 'Add keyboard shortcuts, history log, scientific mode' },
                    { title: 'Deploy / Share', desc: 'Package with `pyinstaller --onefile calculator.py` → creates .exe file to share' }
                ]
            },
            {
                id: 2,
                title: 'To-Do List App',
                emoji: '✅',

                steps: [

                    { title: 'Project Structure', desc: "HTML: header, input section (input box + Add button), task list `<ul id='taskList'>`" },
                    { title: 'Core Logic / Main Feature', desc: "JS functions: `addTask()` - creates li element, `deleteTask(id)` - removes li, `toggleComplete(id)` - toggles strikethrough. Save to `localStorage.setItem('tasks', JSON.stringify(tasks))`" },
                    { title: 'UI / Interface', desc: 'CSS: clean white card, blue add button, green checkmark, red delete. Hover animations.' },
                    { title: 'Testing', desc: 'Add 5 tasks, mark some complete, delete some, refresh page → check persistence' },
                    { title: 'Add Extra Features', desc: 'Filter tabs (All/Active/Done), drag to reorder, due dates, priority levels' },
                    { title: 'Deploy / Share', desc: 'Upload to GitHub Pages → free URL. Or use Tiiny.host to get instant URL.' }
                ]

            {
                id: 3,
                title: 'Number Guessing Game',

        // State
        let bookmarks = JSON.parse(localStorage.getItem('sb_bookmarks') || '[]');
        let activeDifficultyFilter = 'all';
        let activeTechFilter = 'all';
        let searchQuery = '';

        // DOM Elements
        const grid = document.getElementById('projectsGrid');
        const searchInput = document.getElementById('searchInput');
        const diffBtns = document.querySelectorAll('#difficultyFilters .filter-btn');
        const techBtns = document.querySelectorAll('#techFilters .filter-btn');

        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderProjects();
        });

        diffBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                diffBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeDifficultyFilter = e.target.dataset.filter;
                renderProjects();
            });
        });

        techBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                techBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeTechFilter = e.target.dataset.tech;
                renderProjects();
            });
        });

        // Filter Function
        function getFilteredProjects() {
            return PROJECTS.filter(p => {
                // Difficulty
                const matchDiff = activeDifficultyFilter === 'all' || p.difficulty === activeDifficultyFilter;
                
                // Tech
                let matchTech = true;
                if (activeTechFilter !== 'all') {
                    const projectTechs = p.tech.map(t => t.toLowerCase());
                    if (activeTechFilter === 'html') {
                        matchTech = projectTechs.includes('html') || projectTechs.includes('css') || projectTechs.includes('javascript');
                    } else {
                        matchTech = projectTechs.includes(activeTechFilter);
                    }
                }

                // Search
                const matchSearch = !searchQuery || 
                    p.title.toLowerCase().includes(searchQuery) || 
                    p.desc.toLowerCase().includes(searchQuery) ||
                    p.tech.join(' ').toLowerCase().includes(searchQuery);

                return matchDiff && matchTech && matchSearch;
            });
        }

        // Render Function
        function renderProjects() {
            const filtered = getFilteredProjects();
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results"><h3>No projects found</h3><p>Try adjusting your search or filters.</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const isBookmarked = bookmarks.includes(p.id);
                const chipsHtml = p.tech.map(t => `<span class="tech-chip">${t}</span>`).join('');
                
                const stepsHtml = p.steps.map((step, idx) => `
                    <div class="step-item">
                        <div class="step-title">
                            <span class="step-number">${idx + 1}</span>
                            ${step.title}
                        </div>
                        <div class="step-desc">${step.desc}</div>
                    </div>
                `).join('');

                return `
                    <div class="project-card">
                        <div class="project-header">
                            <div class="project-title">
                                <span class="project-emoji">${p.emoji}</span>
                                <div>
                                    ${p.title}
                                    <div style="margin-top:4px"><span class="difficulty-badge diff-${p.difficulty}">${p.difficulty}</span></div>
                                </div>
                            </div>
                            <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark(${p.id})">
                                ${isBookmarked ? '★' : '☆'}
                            </button>
                        </div>
                        <div class="project-body">
                            <p class="project-desc">${p.desc}</p>
                            <div class="tech-chips">${chipsHtml}</div>
                            <div class="project-meta">
                                <span>⏱️ ${p.time}</span>
                            </div>
                            <button class="view-steps-btn" onclick="toggleSteps(${p.id})">
                                ▶ View Steps
                            </button>
                        </div>
                        <div class="steps-container" id="steps_${p.id}">
                            ${stepsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Toggle Steps
        window.toggleSteps = function(projectId) {
            const el = document.getElementById('steps_' + projectId);
            if (el.style.display === 'block') {
                el.style.display = 'none';
            } else {
                el.style.display = 'block';
            }
        };

        // Toggle Bookmark
        window.toggleBookmark = function(projectId) {
            if (bookmarks.includes(projectId)) {
                bookmarks = bookmarks.filter(b => b !== projectId);
            } else {
                bookmarks.push(projectId);
            }
            localStorage.setItem('sb_bookmarks', JSON.stringify(bookmarks));
            renderProjects();
        };

    </script>
